<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Battle 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Raleway:wght@300;400;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CANVAS partículas fondo -->
  <canvas id="particles"></canvas>

  <!-- ══════════════════════════════
       CABECERA
  ═══════════════════════════════ -->
  <header>
    <p class="subtitle">✦ Nuestro Jueguito ✦</p>
    <h1>Love Battle</h1>
    <div class="header-divider"></div>
  </header>

  <!-- ══════════════════════════════
       ESTADO FIREBASE
  ═══════════════════════════════ -->
  <div id="status-bar">
    <span id="status-dot"></span>
    <span id="status-text">Enamorando…</span>
  </div>

  <!-- ══════════════════════════════
       CONTADOR REGRESIVO
  ═══════════════════════════════ -->
  <div class="countdown-wrap">
    <p class="countdown-label">⏳ reinicio en</p>
    <div class="countdown-clock">
      <div class="clock-block">
        <span id="cd-hours">00</span>
        <span class="clock-unit">h</span>
      </div>
      <span class="clock-sep">:</span>
      <div class="clock-block">
        <span id="cd-minutes">00</span>
        <span class="clock-unit">m</span>
      </div>
      <span class="clock-sep">:</span>
      <div class="clock-block">
        <span id="cd-seconds">00</span>
        <span class="clock-unit">s</span>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════
       TABLERO PRINCIPAL
  ═══════════════════════════════ -->
  <main class="board">

    <!-- ── Samuel ── -->
    <section class="player" id="player-samuel">
      <h2 class="player-name">Samuel</h2>

      <button class="heart-btn" id="btn-samuel" aria-label="Sumar corazón a Samuel">
        <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="grad-samuel" cx="50%" cy="40%" r="60%">
              <stop offset="0%"   stop-color="#ff6b8a" />
              <stop offset="100%" stop-color="#c0003a" />
            </radialGradient>
          </defs>
          <path
            d="M50 85 C50 85 5 55 5 28
               C5 13 16 3 28 3
               C36 3 44 8 50 16
               C56 8 64 3 72 3
               C84 3 95 13 95 28
               C95 55 50 85 50 85Z"
            fill="url(#grad-samuel)"
          />
        </svg>
        <span class="pulse-ring"></span>
      </button>

      <div class="score-wrap">
        <span class="score-label">Te amos</span>
        <span class="score-number" id="score-samuel">0</span>
      </div>

      <!-- Victorias -->
      <div class="wins-wrap">
        <span class="wins-label">🏆 victorias</span>
        <span class="wins-number" id="wins-samuel">0</span>
      </div>
    </section>

    <!-- ── VS ── -->
    <div class="vs-divider">
      <span class="vs-heart">💗</span>
      <span class="vs-text">VS</span>
      <span class="vs-heart">💗</span>
    </div>

    <!-- ── Melannie ── -->
    <section class="player" id="player-melannie">
      <h2 class="player-name">Melannie</h2>

      <button class="heart-btn" id="btn-melannie" aria-label="Sumar corazón a Melannie">
        <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="grad-melannie" cx="50%" cy="40%" r="60%">
              <stop offset="0%"   stop-color="#ffb3c6" />
              <stop offset="100%" stop-color="#e0006b" />
            </radialGradient>
          </defs>
          <path
            d="M50 85 C50 85 5 55 5 28
               C5 13 16 3 28 3
               C36 3 44 8 50 16
               C56 8 64 3 72 3
               C84 3 95 13 95 28
               C95 55 50 85 50 85Z"
            fill="url(#grad-melannie)"
          />
        </svg>
        <span class="pulse-ring"></span>
      </button>

      <div class="score-wrap">
        <span class="score-label">Te amos</span>
        <span class="score-number" id="score-melannie">0</span>
      </div>

      <!-- Victorias -->
      <div class="wins-wrap">
        <span class="wins-label">🏆 victorias</span>
        <span class="wins-number" id="wins-melannie">0</span>
      </div>
    </section>

  </main>

  <!-- ══════════════════════════════
       BARRA DE PROGRESO
  ═══════════════════════════════ -->
  <div class="progress-container">
    <span class="progress-name left">Samuel</span>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="progress-name right">Melannie</span>
  </div>

  <!-- ══════════════════════════════
       MENSAJE ROMÁNTICO DEL DÍA
  ═══════════════════════════════ -->
  <div class="winner-msg" id="winner-msg" hidden>
    <span class="winner-crown">👑</span>
    <p id="winner-text"></p>
  </div>

  <!-- ══════════════════════════════
       RACHA
  ═══════════════════════════════ -->
  <div class="streak-wrap" id="streak-wrap">
    <p class="streak-text" id="streak-text"></p>
  </div>

  <!-- ══════════════════════════════
       HISTORIAL
  ═══════════════════════════════ -->
  <section class="history-section">
    <h3 class="history-title">📜 Récord histórico</h3>
    <div class="history-list" id="history-list">
      <p class="history-empty">Aún no hay batallas registradas.</p>
    </div>
  </section>

  <!-- ══════════════════════════════
       MODAL CELEBRACIÓN
  ═══════════════════════════════ -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-crown">👑</div>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-sub" id="modal-sub"></p>
      <button class="modal-close" id="modal-close">¡Genial! </button>
    </div>
  </div>

  <!-- ══════════════════════════════
       PIE DE PÁGINA
  ═══════════════════════════════ -->
  <footer>
    <p>Aqui se demuestra quien ama mas al otro</p>
  </footer>

  <script type="module" src="script.js"></script>

</body>
</html>
